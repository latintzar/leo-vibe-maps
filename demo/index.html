<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leo Vibe Maps</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script defer src="areas.js"></script><style>*{box-sizing:border-box}body{margin:0;padding-top:var(--atelier-nav-height, 0px);font:16px system-ui;color:#203a32}header{padding:16px 24px;border-bottom:1px solid #ddd}header a{color:inherit}h1{margin:8px 0;font-size:26px}p{line-height:1.5}main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - var(--atelier-nav-height, 0px) - 108px)}aside{padding:24px;overflow:auto}button{display:block;width:100%;text-align:left;background:white;border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0;cursor:pointer}button:hover{border-color:#32745a}#map{height:100%;min-height:380px}small{color:#53645d}a.download{display:inline-block;padding:10px 15px;background:#286b52;color:white;border-radius:7px;text-decoration:none}@media(max-width:700px){main{display:flex;flex-direction:column;height:auto}#map{height:55vh;order:0}aside{order:1}}</style></head><body><header><a href="https://atelierneyra.com/">← Atelier Neyra</a><h1>Leo Vibe Maps</h1></header><main><aside><p>Explore Barcelona neighbourhoods on a map while choosing where to stay.</p><p><small>This interactive example uses the extension’s original five neighbourhoods and tags. Install the extension to try its overlay on supported accommodation maps.</small></p><div id="areas"></div><a class="download" href="leo-vibe-maps.zip" download>Download extension</a><p><a href="https://github.com/latintzar/leo-vibe-maps">GitHub</a></p></aside><div id="map" aria-label="Barcelona neighbourhood map"></div></main><script>window.addEventListener('DOMContentLoaded',()=>{const m=L.map('map').setView([41.3905,2.169],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(m);for(const a of window.vibeAreas){const c=L.circle([a.lat,a.lng],{radius:a.radius,color:a.color,fillOpacity:.27}).addTo(m).bindPopup('<strong>'+a.name+'</strong><br>'+a.vibes.join(' · '));const b=document.createElement('button');b.innerHTML='<strong>'+a.name+'</strong><br><small>'+a.vibes.join(' · ')+'</small>';b.onclick=()=>{m.setView([a.lat,a.lng],15);c.openPopup()};document.querySelector('#areas').append(b)}})</script><script src="https://atelierneyra.com/assets/native-nav/atelier-nav.js" data-project="leo-vibe-maps"></script></body></html>
